# miniOS image composition -- the P1 slice ("it boots and describes itself").
#
# WARNING, read before trusting this file: the key names below follow mkosi's
# current configuration format, and mkosi has renamed sections and keys across
# major versions (the 14 -> 19 rewrite moved almost everything).  This file was
# written without a local mkosi to check it against, so treat it as the shape
# of the build, not as a drop-in config: run `mkosi --version`, then check each
# key against that version's documentation and fix the names.
#
# What this file is authoritative for is the *composition*: which packages,
# which files, which services, and which output formats.

[Distribution]
Distribution=debian
Release=stable
# No desktop, no recommends: every megabyte here is one we would have to take
# from the writable layer, and the interface is the command line (ADR-5: no UI).

[Output]
Format=disk
# Later batches add the other two artifacts from this same configuration:
#   Format=directory  -> container image
#   Format=disk, with a different ImageId -> USB image
ImageId=minios
OutputDirectory=build/

[Content]
Bootable=yes
Bootloader=systemd-boot
KernelCommandLine=console=tty0 console=ttyS0,115200
Packages=
    systemd
    systemd-boot
    systemd-timesyncd
    systemd-resolved
    iproute2
    iputils-ping
    isc-dhcp-client
    iw
    wpasupplicant
    ca-certificates
    python3
    python3-yaml
    python3-venv
    jq
    curl
    less
    nano
    # Deliberately absent: any GPU stack, any ML runtime, lspci/usbutil (their
    # job is covered by hwprofil.py reading /sys directly, and the packages
    # drag in pciutils/usbutils databases we would have to keep current).
SkeletonTrees=mkosi.skeleton:/

[Validation]
# Fail the build rather than ship an image that cannot boot or cannot tell us
# what it is running on.
SecureBoot=no
SignExpectedPcr=no

[Build]
# Pin the build tools so two machines produce the same bytes (F2).
ToolsTree=default
